            answer: "想让奶奶坐下来看海。"
            explanation: "照短文第一句回答即可。"
          - id: u4-read-2
            stem: "开头两天，石子为什么留不住？"
            answer: "石子堆在潮水能冲到的地方，潮水一涨就冲走了。"
            explanation: "意思相近即可。"
          - id: u4-read-3
