        title: 窗台上的豆苗
        origin: original_practice
        credit: 自编阅读材料
        paragraphs:
          - "星期一，妈妈在窗台的杯子里放了三颗绿豆。我用铅笔在杯壁外画了一条细线，标上“水面”。"
          - "星期二，豆子胀大了，皮裂开一条缝。星期三，缝里伸出一点点白芽。我把杯子转了半圈。下午再看，白芽又弯向有光的那边。"
          - "星期五，芽变成了细茎，茎上有两片小叶。我每天晚上把水补到细线那里，并在本子上写下日期和看到的变化。"
          - "星期天，小叶展开了。妈妈问：“你怎么确定它在往光亮的地方长？”我说：“因为我做了标记，还连续看了好几天。”"
        questions:
          - id: u3-read-1
            stem: "“我”用什么方法记录豆苗的变化？"
            answer: "在杯壁外画细线，并按日期把变化写在本子上。"
            explanation: "写出标记和按日期记录即可。"
          - id: u3-read-2
            stem: "白芽后来弯向哪一边？从文中找出原因。"
            answer: "弯向有光的那边。"
            explanation: "短文写白芽又弯向有光的那边。"
          - id: u3-read-3
            stem: "哪句话说明观察要连续进行？请抄下来。"
            answer: "因为我做了标记，还连续看了好几天。"
            explanation: "抄最后一句即可。"
          - id: u3-read-4
            stem: "用一个四字词语概括“我”的做法。"
            answer: "连续观察。"
            explanation: "答“细致观察”也可。"
