    note: "按本项目约定，期中覆盖第1–4单元。课本目录本身不标注期中范围。"
    writing:
      id: midterm-write
      title: 一件我记得清楚的事
      prompt: "第 1、2 单元里，哪篇课文让你想起自己的生活？联系课文，写一件真实的事，把经过写清楚。"
      requirements:
        - "题目自拟。"
        - "写出事情的起因、经过和结果。"
        - "语句通顺，正确使用标点。"
      origin: original_practice
      word_count: 400
  final:
    label: 期末
    units: [1, 2, 3, 4, 5, 6, 7, 8]
    duration_minutes: 90
    note: "按本项目约定，期末覆盖第1–8单元。课本目录本身不标注期末范围。"
    writing:
      id: final-write
      title: 读课文以后
      prompt: "从本学期已学课文里选一个人物或一处景物，写下你的观察，或写下读后想到的一件事。"
      requirements:
        - "题目自拟，点明人物或景物。"
        - "内容具体，顺序清楚。"
        - "语句通顺，正确使用标点。"
      origin: original_practice
      word_count: 400

