# 人教版（统编版）2026秋新版 四年级上册 · 起步题库
# 只收录已核对的课文标题、文学常识和古诗原文。
# 写字表、词语表、官方习作题目未逐页核对，不要在 textbook_words 里编造。
# 不要粘贴仍受著作权保护的现代课文原文；阅读短文须自编或使用公有领域文本。

schema_version: 1

edition:
  id: rj2026
  name: 人教版（统编版）
  series_label: 2026秋新版
  grade: 4
  term: 1
  book_name: 四年级上册

paper_note: "古诗按统编教材通行文本录入。写字表、词语表和官方习作题目尚未收录；除已核对的文学常识、课文标题和古诗外，题目为自编练习。"

unit_duration_minutes: 60

todos:
  - "对照 2026 秋新版纸质课本录入各课写字表、词语表，写入 textbook_words，source 用 textbook。"
  - "核对《现代诗二首》的具体篇目后再著录诗题，不要沿用旧版猜测。"
  - "核对各单元口语交际、官方习作题目和语文园地，替换自编习作。"
  - "第 5–8 单元尚未收录。"
  - "《观潮》《夜间飞行的秘密》《方帽子店》及神话课文的教材署名未逐页核对。"

exam_ranges:
  midterm:
    label: 期中
    units: [1, 2]
    duration_minutes: 90
    note: "起步数据把期中暂定为第 1–2 单元，请按学校实际进度修改。"
    writing:
      id: midterm-write
      title: 一件我记得清楚的事
      prompt: "第 1、2 单元里，哪篇课文让你想起自己的生活？联系课文，写一件真实的事，把经过写清楚。"
      requirements:
        - "题目自拟。"
        - "写出事情的起因、经过和结果。"
        - "语句通顺，正确使用标点。"
      origin: original_practice
      word_count: 400
  final:
    label: 期末
    units: [1, 2, 3, 4]
    duration_minutes: 90
    note: "起步数据只收录第 1–4 单元，期末卷目前只覆盖这些单元。"
    writing:
      id: final-write
      title: 读课文以后
      prompt: "从本学期已学课文里选一个人物或一处景物，写下你的观察，或写下读后想到的一件事。"
      requirements:
        - "题目自拟，点明人物或景物。"
        - "内容具体，顺序清楚。"
        - "语句通顺，正确使用标点。"
      origin: original_practice
      word_count: 400

units:
  - number: 1
    title: 第1单元
    note: "课文标题按项目给定的 2026 秋新版目录收录。"
    lessons:
      - title: 观潮
        author_status: todo
        note: "课文写钱塘江大潮。2026 秋新版署名未逐页核对，不出作者题。"
      - title: 繁星
        author: 巴金
        author_status: verified
        note: "巴金散文。此处不收录原文。"
      - title: 现代诗二首
        author_status: todo
        note: "具体篇目未对照 2026 秋纸质课本，不著录诗题，也不出默写。"
    words:
      - word: 观潮
        source: lesson_title
        detail: "课文标题《观潮》"
      - word: 繁星
        source: lesson_title
        detail: "课文标题《繁星》"
    textbook_words: []
    poems: []
    cloze_items:
      - id: u1-cloze-1
        bank: [渐渐, 突然, 从来]
        text: "太阳____落到江面附近，天色暗了下来。"
        answer: 渐渐
        origin: original_practice
        explanation: "“渐渐”表示缓慢变化。"
      - id: u1-cloze-2
        bank: [安静, 热闹, 危险]
        text: "潮水过去以后，江边又____了，只听见轻轻的水声。"
        answer: 安静
        origin: original_practice
        explanation: "后文只有轻轻的水声，所以用“安静”。"
      - id: u1-cloze-3
        bank: [仔细, 马虎, 偷偷]
        text: "爷爷让我____看，先看见什么，后看见什么。"
        answer: 仔细
        origin: original_practice
        explanation: "观察要按顺序看清楚。"
      - id: u1-cloze-4
        bank: [推荐, 批评, 隐藏]
        text: "我想把这处能看晚霞的江边____给同学。"
        answer: 推荐
        origin: original_practice
        explanation: "向别人介绍好地方，用“推荐”。"
      - id: u1-cloze-5
        bank: [印象, 口令, 行李]
        text: "那道白色的浪线给我留下了很深的____。"
        answer: 印象
        origin: original_practice
        explanation: "记得清楚，就是留下印象。"
      - id: u1-cloze-6
        bank: [连续, 中断, 放弃]
        text: "我____观察了三个傍晚，才把江水的变化说清楚。"
        answer: 连续
        origin: original_practice
        explanation: "三个傍晚接连观察，用“连续”。"
    choice_items:
      - id: u1-choice-1
        kind: judge
        stem: "《繁星》的作者是巴金。"
        answer: 对
        origin: content_fact
        explanation: "《繁星》是巴金的散文。"
      - id: u1-choice-2
        kind: judge
        stem: "《观潮》写的是钱塘江大潮。"
        answer: 对
        origin: content_fact
        explanation: "课文《观潮》写的是钱塘江大潮。"
      - id: u1-choice-3
        kind: judge
        stem: "《繁星》的作者是鲁迅。"
        answer: 错
        origin: content_fact
        explanation: "作者是巴金，不是鲁迅。"
      - id: u1-choice-4
        kind: judge
        stem: "《观潮》主要写的是沙漠里的风沙。"
        answer: 错
        origin: content_fact
        explanation: "写的是钱塘江大潮，不是沙漠风沙。"
      - id: u1-choice-5
        kind: judge
        stem: "《繁星》和《现代诗二首》都是古诗。"
        answer: 错
        origin: content_fact
        explanation: "《繁星》是散文；《现代诗二首》是现代诗，不是古诗。"
      - id: u1-choice-6
        kind: single
        stem: "《繁星》的作者是："
        options: [鲁迅, 巴金, 老舍, 朱自清]
        answer: B
        origin: content_fact
        explanation: "作者是巴金。"
      - id: u1-choice-7
        kind: single
        stem: "《观潮》写的景象是："
        options: [钱塘江大潮, 黄河壶口瀑布, 庐山云雾, 海边日出]
        answer: A
        origin: content_fact
        explanation: "写的是钱塘江大潮。"
      - id: u1-choice-8
        kind: single
        stem: "阅读写景文章时，下面哪种做法更合适？"
        options: [只抄优美的词, 按顺序说出看到和听到的, 跳过不认识的景物, 只看标题]
        answer: B
        origin: original_practice
        explanation: "按顺序说看到的和听到的，观察才清楚。"
    readings:
      - id: u1-read
        title: 江边的傍晚
        origin: original_practice
        credit: 自编阅读材料
        paragraphs:
          - "爷爷牵着我走到江边。太阳快落下去了，江面一半还亮着，一半已经暗了。远处先传来低低的声音，像很多人在远远的地方说话。"
          - "“别急，看仔细。”爷爷说。"
          - "声音越来越近，一道白线慢慢推过来。江水被它挤得鼓起来，浪头拍到岸上，溅湿了我的裤脚。我抓紧爷爷的手，又害怕又想笑。白线过去以后，江水还在轻轻地晃，声音小了，天空里露出几颗细细的星。"
          - "爷爷问：“你刚才先看见什么，后看见什么？”我按顺序说：先是江边的光，再是远处的声音，然后是那道白线，最后是星星。"
        questions:
          - id: u1-read-1
            stem: "短文里的“我”是和谁一起到江边的？"
            answer: "爷爷。"
            explanation: "开头写爷爷牵着“我”。"
          - id: u1-read-2
            stem: "那道白线过来的时候，“我”有什么表现？"
            answer: "抓紧爷爷的手，又害怕又想笑。"
            explanation: "意思相近即可。"
          - id: u1-read-3
            stem: "白线过去以后，天空有什么变化？"
            answer: "露出几颗细细的星。"
            explanation: "照短文回答即可。"
          - id: u1-read-4
            stem: "请用“先……再……然后……最后……”说一说“我”观察到的顺序。"
            answer: "先是江边的光，再是远处的声音，然后是那道白线，最后是星星。"
            explanation: "顺序与短文最后一节一致即可。"
    writing:
      id: u1-write
      title: 写一处自然景象
      prompt: "你观察过潮水、星空、晚霞或一场雨吗？选一处印象最深的自然景象写下来。"
      requirements:
        - "题目自拟。"
        - "按一定顺序写，把看到的、听到的写清楚。"
        - "语句通顺，正确使用标点。"
      origin: original_practice
      word_count: 300

  - number: 2
    title: 第2单元
