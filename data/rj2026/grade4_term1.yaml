          - "村子外面有一块常被海水盖住的礁石。阿禾想在礁石旁边垒一个小平台，好让奶奶坐下来看海。"
          - "第一天，他捡来十颗石子，潮水一涨，全冲走了。第二天他又捡，还是被冲走了。同伴说：“别捡了，海比你有力气。”"
          - "阿禾不再把石子直接堆在潮水最猛的地方。他先在高一点的石缝里卡紧大石，再把小石子填进缝里。一天又一天，平台终于高出了一般的潮水。"
          - "奶奶坐下时，浪花只打到平台边上。阿禾说：“我比不过整片海，可我可以把石子放到海一时冲不走的地方。”"
        questions:
