            stem: "阿禾为什么要垒平台？"
            answer: "想让奶奶坐下来看海。"
            explanation: "照短文第一句回答即可。"
          - id: u4-read-2
            stem: "开头两天，石子为什么留不住？"
            answer: "石子堆在潮水能冲到的地方，潮水一涨就冲走了。"
            explanation: "意思相近即可。"
          - id: u4-read-3
            stem: "后来他改变了什么做法？"
            answer: "先在高处的石缝里卡紧大石，再把小石子填进缝里。"
            explanation: "写出先卡大石、再填小石即可。"
          - id: u4-read-4
            stem: "你觉得阿禾是个怎样的孩子？写出一个理由。"
            answer: "他会坚持，并且肯想办法。他没有放弃，还改了垒石子的方法。"
            explanation: "观点明确，并用短文中的做法作理由即可。"
