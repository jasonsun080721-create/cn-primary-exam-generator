          - "我先写“亲爱的奶奶”，再写上个暑假她教我摘豆角的事，还写了我想对她说的谢谢。最后写“祝您身体健康”，签上自己的名字和日期。"
          - "写完我读了一遍，发现把日期写成了今年六月。爸爸说：“日期要写今天，不然奶奶会以为信在路上走了很久。”"
          - "我改好日期，把信放进信封。虽然后来我们还是一起去看了奶奶，这封信我还是交到了她手里。"
        questions:
