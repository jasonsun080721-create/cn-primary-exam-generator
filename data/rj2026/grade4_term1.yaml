paper_note: "古诗按统编教材通行文本录入。词语表只收录已从课本词语表页读清的词，未录完的课次不出那些词。识字表、写字表和各单元日积月累尚未逐字录全。除已核对的标题、习作题目、文学常识和古诗外，阅读与选词填空为自编练习。"

unit_duration_minutes: 60

todos:
  - "词语表已核对第1、2、4、5、6课。第3课《现代诗二首》在词语表第1页上未见单独条目。第7课和不第8–27课的词语表还没从页面录完，不要用教辅听写单补。"
  - "识字表、写字表已看到页面，但字小，除第1课外未逐字确认，暂不写入。"
  - "各单元日积月累未逐页录全。有一页印着〔唐〕高适《别董大》，末句是“天下谁人不识君”，同一页没有看清单元号。"
  - "《出塞》“龙城/卢城”未在本次页图里逐字核对。诗题已在目录页核对，正文暂用统编通行的“龙城”。"
