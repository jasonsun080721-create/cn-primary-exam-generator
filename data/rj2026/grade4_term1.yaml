        explanation: "先用自己的下等马对国王的上等马，这一场会输。"
      - id: u2-choice-4
        kind: judge
        stem: "田忌三场比赛全部获胜。"
        answer: 错
        origin: content_fact
        explanation: "第一场输，后两场赢，结果是二比一。"
      - id: u2-choice-5
        kind: judge
        stem: "《一个豆荚里的五粒豆》的作者是格林兄弟。"
        answer: 错
        origin: content_fact
        explanation: "作者是安徒生，不是格林兄弟。"
      - id: u2-choice-6
        kind: single
        stem: "《田忌赛马》中出主意的人是："
        options: [齐威王, 孙膑, 安徒生, 田忌的马夫]
        answer: B
        origin: content_fact
        explanation: "出主意的是孙膑。"
      - id: u2-choice-7
        kind: single
        stem: "孙膑安排的三场比赛，结果是："
        options: [三场全胜, 三场全败, 输一场、赢两场, 只比了一场]
        answer: C
        origin: content_fact
        explanation: "下等马对上等马先输一场，再赢后两场。"
      - id: u2-choice-8
        kind: single
        stem: "《一个豆荚里的五粒豆》的作者是："
        options: [安徒生, 格林兄弟, 叶圣陶, 巴金]
        answer: A
        origin: content_fact
        explanation: "作者是安徒生。"
    readings:
      - id: u2-read
        title: 换一换顺序
        origin: original_practice
        credit: 自编阅读材料
        paragraphs:
          - "体育课上，四年级有甲、乙、丙三支小队，甲队最有劲，乙队中等，丙队力气小一些。三年级也有强、中、弱三支小队。"
          - "四年级先派出甲队，对三年级最强的队。两边拉了很久，绳子几乎不动。小队长林林说：“照这样比，我们未必能赢两场。”"
          - "周周在纸上画了三个圈，说：“让丙队先去对他们最强的队；甲队对他们中等的队；乙队对他们最弱的队。”"
          - "老师同意试一次。第一场四年级输了。后两场，绳子慢慢移向四年级这边。林林这才明白：周周不是让大家使蛮劲，而是先看清楚对手，再安排自己的力量。"
        questions:
          - id: u2-read-1
            stem: "周周是怎样安排三场比赛的？"
            answer: "用最弱的队对对方最强的队，用最强的队对对方中等的队，用中等的队对对方最弱的队。"
            explanation: "写出这三组对阵即可。"
          - id: u2-read-2
            stem: "按周周的办法，第一场的结果是什么？"
            answer: "四年级输了。"
            explanation: "短文写第一场四年级输了。"
          - id: u2-read-3
            stem: "林林明白了什么道理？"
            answer: "要先看清楚对手，再安排自己的力量。"
            explanation: "意思相近即可。"
          - id: u2-read-4
            stem: "短文中的“蛮劲”是什么意思？用自己的话说。"
            answer: "只靠力气，不讲方法。"
            explanation: "意思相近即可。"
    writing:
      id: u2-write
      title: 一个想了办法的人
      prompt: "写一个小故事。故事里的人物遇到一件难事，想出一个办法，并把事情做完。"
      requirements:
        - "题目自拟。"
        - "写出人物怎么想、怎么做。"
        - "有开头、经过和结果。"
      origin: original_practice
      word_count: 300

