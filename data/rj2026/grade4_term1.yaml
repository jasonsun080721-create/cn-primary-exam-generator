    textbook_words: []
    poems:
      - title: 暮江吟
        dynasty: 唐
        author: 白居易
        lines:
          - 一道残阳铺水中
          - 半江瑟瑟半江红
          - 可怜九月初三夜
          - 露似真珠月似弓
        glosses:
          - term: 瑟瑟
            meaning: "诗中形容未受到残阳照射的江水呈青绿色"
          - term: 可怜
            meaning: "可爱"
          - term: 真珠
            meaning: "珍珠。统编教材用“真珠”，写作“珍珠”可在评分时酌情给分"
        teacher_note: "“真珠”即珍珠，答题以课文用字“真珠”为准。"
        words:
          - word: 残阳
            source: poem
            detail: "《暮江吟》原文"
          - word: 瑟瑟
            source: poem
            detail: "《暮江吟》原文"
          - word: 真珠
            source: poem
            detail: "《暮江吟》原文，即珍珠"
      - title: 题西林壁
        dynasty: 宋
        author: 苏轼
        lines:
          - 横看成岭侧成峰
          - 远近高低各不同
          - 不识庐山真面目
          - 只缘身在此山中
        glosses:
          - term: 缘
            meaning: "因为"
          - term: 真面目
            meaning: "事物真正的样子"
