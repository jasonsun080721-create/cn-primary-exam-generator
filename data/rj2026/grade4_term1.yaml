    textbook_words: []
    poems: []
    cloze_items:
      - id: u2-cloze-1
        bank: [办法, 借口, 玩具]
        text: "只靠力气不够，还要先想好____。"
        answer: 办法
        origin: original_practice
        explanation: "先想方法。"
      - id: u2-cloze-2
        bank: [顺序, 脾气, 名字]
        text: "换一换上场的____，结果可能不一样。"
        answer: 顺序
        origin: original_practice
        explanation: "调整先后次序。"
      - id: u2-cloze-3
        bank: [对手, 观众, 裁判]
        text: "比赛以前，要先看清楚____有多强。"
        answer: 对手
        origin: original_practice
        explanation: "了解对方再安排自己的力量。"
      - id: u2-cloze-4
        bank: [全部, 一场, 没有]
        text: "他并没有____获胜，而是输了一场、赢了两场。"
        answer: 全部
        origin: original_practice
        explanation: "“并没有全部获胜”与后文一致。"
      - id: u2-cloze-5
        bank: [故事, 通知, 账单]
        text: "这个____告诉我：想办法，有时比只拼力气更重要。"
        answer: 故事
        origin: original_practice
        explanation: "指读到的故事。"
      - id: u2-cloze-6
        bank: [安排, 放弃, 隐藏]
        text: "孙膑帮助田忌____了三场比赛的马。"
        answer: 安排
        origin: content_fact
        explanation: "孙膑安排的是马的对阵顺序。"
    choice_items:
      - id: u2-choice-1
        kind: judge
        stem: "《一个豆荚里的五粒豆》的作者是安徒生。"
