          - "星期二，豆子胀大了，皮裂开一条缝。星期三，缝里伸出一点点白芽。我把杯子转了半圈。下午再看，白芽又弯向有光的那边。"
          - "星期五，芽变成了细茎，茎上有两片小叶。我每天晚上把水补到细线那里，并在本子上写下日期和看到的变化。"
          - "星期天，小叶展开了。妈妈问：“你怎么确定它在往光亮的地方长？”我说：“因为我做了标记，还连续看了好几天。”"
